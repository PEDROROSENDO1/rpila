[package]
name = "pila-osd"
version = "0.7.1"
edition = "2021"
rust-version = "1.89"
repository = "https://github.com/igalmarino/pila"
description = "Pila's on-screen display: the volume, microphone or brightness level, or what a media key did, for a moment after a key (iced, layer shell); it also sets the brightness and drives media players"
# Apache-2.0: its built-in icons (bar/icons).
license = "GPL-3.0-or-later AND Apache-2.0"
publish = false
# pila-launcher's workspace: its Cargo.lock and target directory.
workspace = "../launcher"

[dependencies]
# As pila-launcher: software rendering (tiny-skia on wl_shm), no GPU set up,
# libwayland-client loaded at runtime (`wayland-dlopen`).
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "wayland",
    "thread-pool",
    "crisp",
    "svg",
] }
iced_layershell = { version = "0.19.1", default-features = false }
# Pila's colors (`pila_ipc.rs`, shared with pila-launcher).
serde_json = "1"
# The brightness through logind and the media keys over MPRIS (`backlight.rs`,
# `media.rs`): pure Rust, the version pila-bar's tray already brings.
zbus = "5"
