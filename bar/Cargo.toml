[package]
name = "pila-bar"
version = "0.7.1"
edition = "2021"
rust-version = "1.89"
repository = "https://github.com/igalmarino/pila"
description = "Pila's bar: workspaces and a clock (iced, layer shell)"
license = "GPL-3.0-or-later"
publish = false
# pila-launcher's workspace: its Cargo.lock and target directory.
workspace = "../launcher"

[dependencies]
# As pila-launcher: software rendering (tiny-skia on wl_shm), no GPU set up,
# libwayland-client loaded at runtime (`wayland-dlopen`).
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "wayland",
    "thread-pool",
    "crisp",
    # The tray's icons: pixmaps, PNG and SVG files (as pila-launcher's).
    "image-without-codecs",
    "svg",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
iced_layershell = { version = "0.19.1", default-features = false }
# Pila's colors, from its IPC socket (`pila_ipc.rs`, shared with pila-launcher).
serde_json = "1"
# The tray (StatusNotifierItem over D-Bus): pure Rust, its blocking API on
# a thread of the tray's own.
zbus = "5"
# The clock: the local time and strftime, in the user's LC_TIME.
libc = "0.2"
# The desktop's state, on iced_layershell's connection (`desktop.rs`):
# versions iced_layershell already brings.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
