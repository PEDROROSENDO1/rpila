# Publish the AUR packages in packaging/aur (pila-git and the metapackage
# pila-desktop) when a PKGBUILD or .SRCINFO there changes on main; each AUR
# repository is named after its directory, and one that isn't there yet is
# created by the first push. The aur environment holds the SSH key
# (AUR_SSH_KEY), only for main, and waits for the maintainer's approval, once
# for all of them: users run what this publishes. Run by hand, it publishes
# whatever differs, and with nothing new it still tests the key.
name: AUR

on:
  push:
    branches: [main]
    paths:
      - packaging/aur/*/PKGBUILD
      - packaging/aur/*/.SRCINFO
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Each .SRCINFO matches its PKGBUILD
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Packages
        run: pacman -Syu --noconfirm --needed base-devel git
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # makepkg doesn't run as root.
      - name: Compare
        run: |
          useradd --create-home builder
          for dir in packaging/aur/*/; do
            name="$(basename "$dir")"
            mkdir "/home/builder/$name"
            cp "$dir/PKGBUILD" "/home/builder/$name/"
            chown -R builder "/home/builder/$name"
            (cd "/home/builder/$name" && runuser -u builder -- makepkg --printsrcinfo) > generated
            diff "$dir/.SRCINFO" generated
          done

  publish:
    name: Publish
    needs: check
    runs-on: ubuntu-latest
    environment: aur
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: SSH
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          # The fingerprint on aur.archlinux.org's home page:
          # SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            > ~/.ssh/aur_known_hosts
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/aur_known_hosts" \
            >> "$GITHUB_ENV"
      # A package new to the AUR clones as an empty repository (git warns), and
      # the push creates it.
      - name: Push
        run: |
          for dir in packaging/aur/*/; do
            name="$(basename "$dir")"
            git clone "ssh://aur@aur.archlinux.org/$name.git" "aur-$name"
            cp "$dir/PKGBUILD" "$dir/.SRCINFO" "aur-$name/"
            (
              cd "aur-$name"
              git add PKGBUILD .SRCINFO
              if git diff --cached --quiet; then
                echo "The AUR already has $name."
                exit 0
              fi
              version="$(sed -n 's/^\tpkgver = //p' .SRCINFO)"
              release="$(sed -n 's/^\tpkgrel = //p' .SRCINFO)"
              git -c user.name="Ignacio Galmarino" \
                -c user.email="igalmarino@users.noreply.github.com" \
                commit -m "Update to $version-$release"
              git push origin HEAD:master
            )
          done
