# Written by Pila (`tool-configs`): Pila's [colors] and text size, the
# windows' 8 px corners. Pila writes it at every start and when [colors]
# changes: to change it, copy it to ~/.config, which the tool then reads
# instead.

[main]
# Pixels, as Pila's title bars: the same size as theirs.
font=sans-serif:pixelsize=14
# Sized by the monitor's scale, as Pila and the other tools are, not by its
# DPI (fuzzel's default where every scale is 1): the same size on a laptop's
# panel as on a monitor beside it.
dpi-aware=no
lines=10
width=42
# Rows tall enough for icons to be legible (they follow the row's height).
line-height=20
horizontal-pad=20
vertical-pad=16
inner-pad=12
prompt=""
placeholder=Search
match-counter=yes

[colors]
background=@bar-inactive@ff
text=@icon@ff
prompt=@icon-inactive@ff
placeholder=@icon-inactive@ff
input=@hover-icon@ff
match=@snap-preview@ff
# The entry Enter starts, in the accent color: plain to see.
selection=@snap-preview@ff
selection-text=@close-hover-icon@ff
selection-match=@background@ff
counter=@icon-inactive@ff
border=@hover@ff

[border]
width=1
radius=8
selection-radius=0
