# Written by Pila (`tool-configs`): Pila's default colors, square corners.
# Pila writes it at every start: to change it, copy it to ~/.config, which
# the tool then reads instead.

[main]
font=sans-serif:size=11
# Sized by the monitor's scale, as Pila and the other tools are, not by its
# DPI (fuzzel's default where every scale is 1): the same size on a laptop's
# panel as on a monitor beside it.
dpi-aware=no
lines=10
width=42
# Rows tall enough for icons to be legible (they follow the row's height).
line-height=20
horizontal-pad=20
vertical-pad=16
inner-pad=12
prompt=""
placeholder=Search
match-counter=yes

[colors]
background=26272bff
text=dfe1e5ff
prompt=80838aff
placeholder=80838aff
input=f2f3f5ff
match=4477ccff
# The entry Enter starts, in the accent color: plain to see.
selection=4477ccff
selection-text=ffffffff
selection-match=1f2126ff
counter=80838aff
border=3f4249ff

[border]
width=1
radius=0
selection-radius=0
