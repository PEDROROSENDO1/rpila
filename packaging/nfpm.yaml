# The .deb and .rpm of a release (.github/workflows/packages.yml), from what
# scripts/install puts in stage/ with PREFIX=/usr. A directory added to
# install_files is added here too.
name: pila
version: ${VERSION}
release: "1"
arch: amd64
section: x11
priority: optional
maintainer: Ignacio Galmarino <igalmarino@gmail.com>
description: A stacking Wayland compositor built on Smithay
homepage: https://github.com/igalmarino/pila
# Apache-2.0: the icons built into pila-bar and pila-osd (bar/icons).
license: GPL-3.0-or-later AND Apache-2.0

contents:
  - src: stage/usr/bin/*
    dst: /usr/bin/
    file_info:
      mode: 0755
  - src: stage/usr/share/pila/check/*
    dst: /usr/share/pila/check/
  - src: stage/usr/share/wayland-sessions/*
    dst: /usr/share/wayland-sessions/
  - src: stage/usr/lib/systemd/user/*
    dst: /usr/lib/systemd/user/
  - src: stage/usr/share/icons/hicolor/scalable/apps/*
    dst: /usr/share/icons/hicolor/scalable/apps/
  - src: stage/usr/share/man/man1/*
    dst: /usr/share/man/man1/
  - src: stage/usr/share/doc/pila/*
    dst: /usr/share/doc/pila/
  - src: stage/etc/xdg/xdg-desktop-portal/*
    dst: /etc/xdg/xdg-desktop-portal/
    type: config
  - src: stage/etc/xdg/xdg-desktop-portal-wlr/*
    dst: /etc/xdg/xdg-desktop-portal-wlr/
    type: config

overrides:
  # Built on the oldest release supported, Ubuntu 24.04: its glibc is the minimum.
  deb:
    depends:
      - bash
      - libc6 (>= 2.39)
      - libgcc-s1
      - libegl1
      - libgbm1
      - libinput10
      - libseat1
      - libudev1
      - libxkbcommon0
    # X11 apps: Pila runs without (and with [xwayland] enabled = false).
    recommends:
      - xwayland
      - kitty
      - xdg-desktop-portal-wlr
      - xdg-desktop-portal-gtk
      - xdg-utils
      # The default bar and launcher.
      - waybar
      - fuzzel
      # The volume, brightness and media keys' default bindings.
      - wireplumber
      - brightnessctl
      - playerctl
      # The screenshot keys' default bindings.
      - grim
      - slurp
      - wl-clipboard
    # Not installed by default: a desktop shell may have its own lock
    # screen.
    suggests:
      - swaylock
  # Built on the oldest Fedora maintained, 44: its glibc is the minimum.
  rpm:
    depends:
      - bash
      - glibc >= 2.43
      - mesa-libEGL
      - mesa-libgbm
      - libinput
      - libseat
      - systemd-libs
      - libxkbcommon
    recommends:
      - xorg-x11-server-Xwayland
      - kitty
      - xdg-desktop-portal-wlr
      - xdg-desktop-portal-gtk
      - xdg-utils
      # The default bar and launcher.
      - waybar
      - fuzzel
      # The volume, brightness and media keys' default bindings.
      - wireplumber
      - brightnessctl
      - playerctl
      # The screenshot keys' default bindings.
      - grim
      - slurp
      - wl-clipboard
    # Not installed by default: a desktop shell may have its own lock
    # screen.
    suggests:
      - swaylock
