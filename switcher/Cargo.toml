[package]
name = "pila-switcher"
version = "0.7.1"
edition = "2021"
rust-version = "1.89"
repository = "https://github.com/igalmarino/pila"
description = "Pila's window switcher: previews of the windows of a Mod+Tab, shown while it's held (iced, layer shell)"
license = "GPL-3.0-or-later"
publish = false
# pila-launcher's workspace: its Cargo.lock and target directory.
workspace = "../launcher"

[dependencies]
# As pila-launcher: software rendering (tiny-skia on wl_shm), no GPU set up,
# libwayland-client loaded at runtime (`wayland-dlopen`).
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "wayland",
    "thread-pool",
    "crisp",
    # The apps' icons, PNG and SVG files (as pila-launcher's).
    "image-without-codecs",
    "svg",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
iced_layershell = { version = "0.19.1", default-features = false }
# Pila's IPC (`pila_ipc.rs`, shared with pila-launcher): the switch, the
# windows and the colors.
serde_json = "1"
# The windows' previews (`previews.rs`): ext-image-copy-capture on a
# connection of their own, the versions iced_layershell already brings; libc
# for the shm buffers (memfd) and polling with a deadline.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
libc = "0.2"
