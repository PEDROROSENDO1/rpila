[package]
name = "pila-shot"
version = "0.7.1"
edition = "2021"
rust-version = "1.89"
repository = "https://github.com/igalmarino/pila"
description = "Pila's screenshots: a monitor or a region to a PNG file or the clipboard, and the monitor to share for screen sharing (iced, layer shell)"
license = "GPL-3.0-or-later"
publish = false
# pila-launcher's workspace: its Cargo.lock and target directory.
workspace = "../launcher"

[dependencies]
# As pila-launcher: software rendering (tiny-skia on wl_shm), no GPU set up,
# libwayland-client loaded at runtime (`wayland-dlopen`). The frozen
# screen under the selection is an image; the selection, a canvas.
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "wayland",
    "thread-pool",
    "crisp",
    "image-without-codecs",
    "canvas",
] }
iced_layershell = { version = "0.19.1", default-features = false }
# The PNG files (`save.rs`): the version pila-launcher's icons already bring.
image = { version = "0.25", default-features = false, features = ["png"] }
# Pila's colors (`pila_ipc.rs`, shared with pila-launcher).
serde_json = "1"
# The captures (`capture.rs`) and the clipboard (`clipboard.rs`), on a
# connection of their own: ext-image-copy-capture and ext-data-control, the
# versions iced_layershell already brings; libc for the shm buffers, polling
# and the local time of a file's name.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
libc = "0.2"
