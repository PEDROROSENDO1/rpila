[package]
name = "pila-launcher"
version = "0.7.1"
edition = "2021"
rust-version = "1.89"
repository = "https://github.com/igalmarino/pila"
description = "Pila's app launcher: the installed apps, searched as you type (iced, layer shell)"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# Software rendering (tiny-skia on wl_shm): no GPU set up, none held while
# hidden. libwayland-client is loaded at runtime (`wayland-dlopen`).
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "wayland",
    "thread-pool",
    "crisp",
    "image-without-codecs",
    "svg",
] }
# Not used directly: iced_layershell 0.19.1 (its iced_exdevtools) doesn't
# build on a later winit beta, and asks for any. Drop with an
# iced_layershell that does.
winit-common = "=0.31.0-beta.2"
winit-core = "=0.31.0-beta.2"
# The one image format icons come in besides SVG.
image = { version = "0.25", default-features = false, features = ["png"] }
iced_layershell = { version = "0.19.1", default-features = false }
# Pila's colors, from its IPC socket (`pila_ipc.rs`).
serde_json = "1"

# A workspace of its own, with its own Cargo.lock: iced_layershell needs a
# winit-core beta older than the one Smithay pins, and one lock file can't
# hold both. pila-bar (../bar) shares it: one lock, one target directory, one
# build of iced for both.
[workspace]
members = [".", "../bar"]
default-members = [".", "../bar"]
